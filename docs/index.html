<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Przegląd dnia</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --mut:#94a3b8; --acc:#38bdf8; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f8fafc; --card:#fff; --fg:#0f172a; --mut:#64748b; --acc:#0369a1; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding-bottom:env(safe-area-inset-bottom); }
  header { padding:14px 16px 6px; padding-top:calc(14px + env(safe-area-inset-top)); }
  h1 { font-size:20px; margin:0; }
  .meta { color:var(--mut); font-size:13px; }
  nav { display:flex; gap:6px; overflow-x:auto; padding:8px 16px; position:sticky; top:0;
        background:var(--bg); scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:0 0 auto; border:1px solid var(--mut); background:none; color:var(--fg);
               padding:6px 12px; border-radius:999px; font-size:14px; }
  nav button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  main { padding:8px 16px 32px; max-width:760px; margin:0 auto; }
  .card { background:var(--card); border-radius:12px; padding:12px 14px; margin:10px 0; }
  .card h3 { margin:0 0 6px; font-size:15px; color:var(--acc); }
  .card a { color:var(--fg); text-decoration:none; display:block; padding:6px 0;
            border-top:1px solid rgba(148,163,184,.2); }
  .card a:first-of-type { border-top:0; }
  .digest h2 { font-size:18px; margin:22px 0 6px; color:var(--acc); }
  .digest ul { padding-left:20px; margin:6px 0; }
  .digest li { margin:6px 0; }
  .note { background:var(--card); border-left:3px solid #f59e0b; padding:10px 12px;
          border-radius:8px; font-size:14px; margin:10px 0; }
  button.refresh { margin-left:8px; background:none; border:0; color:var(--acc); font-size:13px; }
  #player { position:fixed; left:0; right:0; bottom:0; display:none; gap:8px; align-items:center;
            justify-content:center; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
            background:var(--card); border-top:1px solid rgba(148,163,184,.3); }
  #player.show { display:flex; }
  #player button { border:0; border-radius:999px; padding:9px 16px; font-size:15px;
                   background:var(--acc); color:#fff; }
  #player button.sec { background:none; border:1px solid var(--mut); color:var(--fg); }
  #player .st { color:var(--mut); font-size:13px; flex:1; min-width:0; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  main { padding-bottom:90px; }
</style>
</head>
<body>
<header>
  <h1>Przegląd dnia</h1>
  <div class="meta"><span id="when">ładuję…</span><button class="refresh" id="rf">odśwież</button></div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="player">
  <button id="play">▶ Czytaj</button>
  <button id="stop" class="sec">■</button>
  <select id="rate" class="sec" aria-label="Prędkość" style="border:1px solid var(--mut);background:none;color:var(--fg);border-radius:999px;padding:8px">
    <option value="0.9">0.9×</option><option value="1" selected>1×</option>
    <option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option>
  </select>
  <span class="st" id="pst"></span>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function md(src) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let out = '', inList = false;
  for (const raw of src.split('\n')) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (/^#{1,3}\s/.test(line)) out += `<h2>${inline(line.replace(/^#+\s*/, ''))}</h2>`;
    else if (line.trim()) out += `<p>${inline(line)}</p>`;
  }
  return out + (inList ? '</ul>' : '');
}

let data, tab = 'Podsumowanie';

function render() {
  const tabs = ['Podsumowanie', ...Object.keys(data.blocs)];
  $('#tabs').innerHTML = tabs.map(t =>
    `<button class="${t === tab ? 'on' : ''}" data-t="${t}">${t}</button>`).join('');
  let h = '';
  if (data.note) h += `<div class="note">${esc(data.note)}</div>`;
  if (tab === 'Podsumowanie') {
    h += data.digest ? `<div class="digest">${md(data.digest)}</div>`
                     : '<p class="meta">Brak podsumowania – zobacz zakładki ze źródłami.</p>';
    if (data.failed.length)
      h += `<p class="meta">Niedostępne źródła: ${data.failed.map(f => esc(f.source)).join(', ')}</p>`;
  } else {
    for (const s of data.blocs[tab])
      h += `<div class="card"><h3>${esc(s.source)}</h3>` +
           s.items.map(i => `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>`).join('') +
           '</div>';
  }
  $('#view').innerHTML = h;
}

async function load() {
  try {
    const r = await fetch('data.json?' + Date.now(), { cache: 'no-store' });
    data = await r.json();
    $('#when').textContent = 'aktualizacja: ' + new Date(data.generated_at).toLocaleString('pl-PL',
      { dateStyle: 'medium', timeStyle: 'short' });
    render();
  } catch (e) {
    $('#when').textContent = 'brak danych (offline?)';
  }
}

// ---------- Odczyt głosowy (Web Speech API) ----------
const synth = window.speechSynthesis;
const BLOC_LANG = { 'Polska': 'pl-PL', 'Rosja': 'ru-RU' };   // reszta: angielski
let queue = [], qi = 0, speaking = false, paused = false, gen = 0;

function stripMd(t) { return t.replace(/\*\*/g, '').replace(/^#+\s*/, '').replace(/^\s*[-*]\s+/, ''); }

function chunksFromDigest(src) {
  // jeden akapit/punkt listy = jeden fragment (długie wypowiedzi w Chrome potrafią się urwać)
  return src.split('\n').map(stripMd).map(s => s.trim()).filter(Boolean)
    .flatMap(s => s.length < 400 ? [s] : (s.match(/[^.!?]+[.!?]*\s*/g) || [s]))
    .map(text => ({ text, lang: 'pl-PL' }));
}

function chunksFromTab() {
  const lang = BLOC_LANG[tab] || 'en-US';
  const out = [{ text: tab, lang: 'pl-PL' }];
  for (const s of data.blocs[tab] || []) {
    out.push({ text: s.source, lang: 'pl-PL' });
    for (const i of s.items) out.push({ text: i.title, lang });
  }
  return out;
}

function pickVoice(lang) {
  const vs = synth.getVoices();
  const base = lang.slice(0, 2);
  return vs.find(v => v.lang === lang && v.localService) || vs.find(v => v.lang === lang)
      || vs.find(v => v.lang.startsWith(base)) || null;
}

function setBtn() {
  $('#play').textContent = !speaking ? '▶ Czytaj' : paused ? '▶ Wznów' : '⏸ Pauza';
  $('#pst').textContent = speaking ? `${qi + 1} / ${queue.length}` : '';
}

function speakNext() {
  if (qi >= queue.length) { speaking = false; setBtn(); return; }
  const c = queue[qi];
  const u = new SpeechSynthesisUtterance(c.text);
  u.lang = c.lang;
  const v = pickVoice(c.lang);
  if (v) u.voice = v;
  u.rate = parseFloat($('#rate').value);
  const g = gen;
  u.onend = () => { if (speaking && g === gen) { qi++; setBtn(); speakNext(); } };
  u.onerror = e => {
    if (g !== gen || e.error === 'canceled' || e.error === 'interrupted') return;
    qi++; speakNext();
  };
  setBtn();
  synth.speak(u);
}

function startReading() {
  gen++; synth.cancel();
  queue = tab === 'Podsumowanie' ? chunksFromDigest(data.digest || '') : chunksFromTab();
  if (!queue.length) { $('#pst').textContent = 'brak tekstu do czytania'; return; }
  qi = 0; speaking = true; paused = false;
  speakNext();
}

function stopReading() { gen++; speaking = false; paused = false; synth.cancel(); setBtn(); }

$('#play').onclick = () => {
  if (!speaking) startReading();
  else if (paused) { synth.resume(); paused = false; setBtn(); }
  else { synth.pause(); paused = true; setBtn(); }
};
$('#stop').onclick = stopReading;
$('#rate').onchange = () => { if (speaking && !paused) { gen++; synth.cancel(); speakNext(); } };
if (synth) { synth.getVoices(); synth.onvoiceschanged = () => {}; $('#player').classList.add('show'); }
window.addEventListener('pagehide', stopReading);

$('#tabs').addEventListener('click', e => {
  if (e.target.dataset.t) { stopReading(); tab = e.target.dataset.t; render(); scrollTo(0, 0); }
});
$('#rf').onclick = load;
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
